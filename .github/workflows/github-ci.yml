name: GitHub CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
        env:
          CGO_ENABLED: 0
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run natsjs tests
        run: |
          cd natsjs/
          go test -v -cover ./...
        env:
          CGO_ENABLED: 0