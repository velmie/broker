version: "2"
run:
  timeout: 5m
  relative-path-mode: gomod
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    govet:
      enable:
        - shadow
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
    funlen:
      lines: 120
      statements: 60
    goconst:
      # Independent test fixtures need not share a constant just because values match.
      ignore-tests: true
      min-len: 2
      min-occurrences: 2
    gocritic:
      # Exported contracts may precede private receiver types.
      disabled-checks:
        - typeDefFirst
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 140
    misspell:
      locale: US
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
        path: _test\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/velmie/broker
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
