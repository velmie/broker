version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 120
      statements: 60
    goconst:
      min-len: 2
      min-occurrences: 2
    errcheck:
      # Common ack/close patterns in tests and tear-downs; team historically
      # ignores these errors per legacy v1.50 config.
      exclude-functions:
        - (*github.com/nats-io/nats.go.Msg).Ack
        - (*github.com/nats-io/nats.go.Msg).AckSync
        - (*github.com/nats-io/nats.go.Msg).Nak
        - (*github.com/nats-io/nats.go.Msg).NakWithDelay
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        # Pre-existing patterns kept for parity with legacy v1 config.
        - appendAssign
        - hugeParam
        - sloppyReassign
        - elseif
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 145
    misspell:
      locale: US
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests: relaxed rules (parity with legacy v1 behavior).
      - linters:
          - errcheck
          - funlen
          - goconst
          - gocritic
          - gochecknoinits
          - gosec
          - govet
          - lll
          - mnd
          - misspell
          - staticcheck
          - unparam
          - whitespace
        path: _test\.go$
      # otelbroker middleware: pre-existing patterns kept for parity.
      - linters:
          - staticcheck
          - unparam
        path: otelbroker/middleware\.go$
      # azuresb: pre-existing patterns kept for parity.
      - linters:
          - gosec
        path: azuresb/subscription\.go$
        text: 'G118'
      - linters:
          - misspell
        path: azuresb/receiver\.go$
        text: 'cancelled'
    paths:
      - third_party$
      - builtin$
      - examples$
      - _examples
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/velmie/broker
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
